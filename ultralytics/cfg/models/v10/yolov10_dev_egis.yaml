# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.1, 1024] 

# YOLOv8.0n backbone
backbone:
  - [-1, 1, DWStemLayer, [3, 12]] #0/P1
  - [-1, 1, GatedCNNBlock, [12, 2, 7, 1.0]] #1
  - [-1, 1, GatedCNNBlock, [12, 2, 7, 1.0]] #2
  - [-1, 1, GatedCNNBlock, [12, 2, 7, 1.0]] #3
  - [-1, 1, DWDownsampleLayer, [12, 24]] #4/P2
  - [-1, 1, GatedCNNBlock, [24, 2, 7, 1.0]] #5
  - [-1, 1, GatedCNNBlock, [24, 2, 7, 1.0]] #6
  - [-1, 1, GatedCNNBlock, [24, 2, 7, 1.0]] #7
  - [-1, 1, DWDownsampleLayer, [24, 36]] #8/P3
  - [-1, 1, GatedCNNBlock, [36, 2.67, 7, 1.0]] #9
  - [-1, 1, GatedCNNBlock, [36, 2.67, 7, 1.0]] #10
  - [-1, 1, GatedCNNBlock, [36, 2.67, 7, 1.0]] #11
  - [-1, 1, DWDownsampleLayer, [36, 48]] #12/P4
  - [-1, 1, GatedCNNBlock, [48, 2, 7, 1.0]] #13

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 22 (P4/16-medium)

  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2fCIB, [1024, True, True]] # 25 (P5/32-large)

  - [[19, 22, 25], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
