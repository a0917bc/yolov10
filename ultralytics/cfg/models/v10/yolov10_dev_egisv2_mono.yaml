# Parameters
nc: 1 # number of classes


# YOLOv8.0n backbone
backbone:
  - [-1, 1, DWgrayStemLayer, [1, 12]] #0/P1
  - [-1, 1, GatedCNNBlock, [12, 2, 7, 1.0, 0]] #1
  - [-1, 1, GatedCNNBlock, [12, 2, 7, 1.0, 0.001]] #2
  - [-1, 1, GatedCNNBlock, [12, 2, 7, 1.0, 0.002]] #3
  - [-1, 1, DWDownsampleLayer, [12, 24]] #4/P2
  - [-1, 1, GatedCNNBlock, [24, 2, 7, 1.0, 0.003]] #5
  - [-1, 1, GatedCNNBlock, [24, 2, 7, 1.0, 0.004]] #6
  - [-1, 1, GatedCNNBlock, [24, 2, 7, 1.0, 0.005]] #7
  - [-1, 1, DWDownsampleLayer, [24, 36]] #8/P3
  - [-1, 1, GatedCNNBlock, [36, 2.67, 7, 1.0, 0.006]] #9
  - [-1, 1, GatedCNNBlock, [36, 2.67, 7, 1.0, 0.007]] #10
  - [-1, 1, GatedCNNBlock, [36, 2.67, 7, 1.0, 0.008]] #11
  - [-1, 1, DWDownsampleLayer, [36, 48]] #12/P4
  - [-1, 1, GatedCNNBlock, [48, 2, 7, 1.0, 0.009]] #13

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, GatedCNNBlock, [84, 1.5, 7, 1]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, GatedCNNBlock, [108, 1, 7, 0.5]] # 19 (P3/8-small)

  - [[13, 16, 19], 1, EgisDetect, [nc]] # Detect(P3, P4, P5)
