# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] 

# YOLOv8.0n backbone
backbone:
  - [-1, 1, conv_3x3_bn, [3, 4, 2]] # 2*0
  - [-1, 1, InvertedResidual, [4, 4, 1, 1]] #1
  - [-1, 1, InvertedResidual, [4 ,4 ,2 ,6]] # 4*2
  - [-1, 1, InvertedResidual, [4, 4, 1, 6]] #3
  - [-1, 1, InvertedResidual, [4, 4, 2, 1]] # 8*4
  - [-1, 1, InvertedResidual, [4, 4, 1, 6]] #5
  - [-1, 1, InvertedResidual, [4, 4, 1, 6]] #6
  - [-1, 1, InvertedResidual, [4, 8, 2, 6]] # 16*7
  - [-1, 1, InvertedResidual, [8, 8, 1, 6]] #8
  - [-1, 1, InvertedResidual, [8, 8, 1, 6]] #9
  - [-1, 1, InvertedResidual, [8, 8, 1, 6]] #10
  - [-1, 1, InvertedResidual, [8, 12, 1, 6]] #11
  - [-1, 1, InvertedResidual, [12, 12, 1, 6]] #12
  - [-1, 1, InvertedResidual, [12, 12, 1, 6]] #13
  - [-1, 1, InvertedResidual, [12, 16, 2, 6]] # 32*14
  - [-1, 1, InvertedResidual, [16, 16, 1, 6]] #15
  - [-1, 1, InvertedResidual, [16, 16, 1, 6]] #16
  - [-1, 1, InvertedResidual, [16, 32, 1, 6]] #17
  - [-1, 1, conv_1x1_bn, [32, 1280]] #18

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 13], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 21

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 24 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 21], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 27 (P4/16-medium)

  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 18], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2fCIB, [1024, True, True]] # 30 (P5/32-large)

  - [[24, 27, 30], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
