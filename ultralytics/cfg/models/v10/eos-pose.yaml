# Parameters
nc: 20 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.1, 1024] 

kpt_shape: [5, 3]
ch: 3

backbone:
  - [-1, 1, ConvBNReLU, [3, 16, 3, 2, 1, True]] #0/P0
  - [-1, 1, InvertedResidualalcor, [16, 8, 1, 1]] #1
  - [-1, 1, InvertedResidualalcor, [8, 20, 2, 10]] #2/P1
  - [-1, 1, InvertedResidualalcor, [20, 20, 1, 3.6]] #3
  - [-1, 1, InvertedResidualalcor, [20, 24, 2, 5.4]] #4/P2
  - [-1, 1, InvertedResidualalcor, [24, 24, 1, 6]] #5
  - [-1, 1, InvertedResidualalcor, [24, 48, 2, 6]] #6/P3
  - [-1, 1, InvertedResidualalcor, [48, 48, 1, 4]] #7
  - [-1, 1, InvertedResidualalcor, [48, 24, 1, 2]] #8
  - [-1, 1, InvertedResidualalcor, [24, 24, 1, 6]] #9
  - [-1, 1, InvertedResidualalcor, [24, 40, 2, 6]] #10/P4

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, InvertedResidualalcor, [64, 64, 1, 4]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, InvertedResidualalcor, [88, 88, 1, 4]] # 16 (P3/8-small)

  - [[10, 13, 16], 1, Pose, [nc, kpt_shape]] # Detect(P3, P4, P5)